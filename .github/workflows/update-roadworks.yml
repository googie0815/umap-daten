name: Baustellendaten aktualisieren

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/update-roadworks.yml'

permissions:
  contents: write

concurrency:
  group: roadworks-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLIC_ORIGIN: https://patient-pine-10b1.iabfall.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: DATEX auswerten und Ergebnis validieren
        run: node scripts/generate.mjs
      - name: Umleitungsaufbereitung testen
        run: python3 scripts/test-rerouting.py
      - name: Umleitungen auswerten und validieren
        run: python3 scripts/generate-rerouting.py
      - name: Nur erfolgreiche Ergebnisse speichern
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/roadworks-datex.geojson data/rerouting-datex.geojson data/status.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Baustellendaten aktualisieren'
          git push origin HEAD:main
